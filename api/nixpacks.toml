# ============================================================================
# Nixpacks Configuration - SOUFER Tools API
# Compatível com Railway, Render, Coolify e CLI Nixpacks
# ============================================================================

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
